name: CPU checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-regression:
    name: CPU regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.22'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run depth CPU regressions
        run: python -W error::ResourceWarning scripts/check_cpu_ci.py --group depth --output "$RUNNER_TEMP/depth-checks.json"
      - name: Run protocol CPU regressions in a separate process
        run: python -W error::ResourceWarning scripts/check_cpu_ci.py --group protocol --output "$RUNNER_TEMP/protocol-checks.json"
      - name: Run generated-data geometry CPU regressions without model imports
        run: python -W error::ResourceWarning scripts/check_geometry_cpu_ci.py --output "$RUNNER_TEMP/geometry-checks.json"
      - name: Check workflow subprocess supervision without CUDA or model imports
        run: python -W error::ResourceWarning -m unittest discover -s tests -p test_workflow.py
      - name: Report checks and explicit skips
        if: always()
        run: |
          for report in "$RUNNER_TEMP/depth-checks.json" "$RUNNER_TEMP/protocol-checks.json" "$RUNNER_TEMP/geometry-checks.json"; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
